<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b09">
  <title>Treinos</title>
  <style>
    :root{color-scheme:dark;--ink:#f6f8ed;--muted:#aab1a2;--ground:#090b09;--line:#414a3c;--signal:#c7ff3c;--signal-ink:#101500}
    *{box-sizing:border-box}
    html{background:var(--ground)}
    body{margin:0;min-width:280px;min-height:100vh;min-height:100dvh;background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 90% 0,rgba(199,255,60,.12),transparent 38%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,100% 32px}
    main{position:relative;width:min(720px,100%);margin:0 auto;padding:max(34px,env(safe-area-inset-top)) 18px max(36px,env(safe-area-inset-bottom))}
    header{padding:18px 2px 28px;border-bottom:1px solid var(--line)}
    h1{max-width:8ch;margin:0;font-size:clamp(3.9rem,20vw,7rem);line-height:.78;letter-spacing:-.065em;text-transform:uppercase}
    header p{display:flex;align-items:center;gap:9px;margin:20px 0 0;color:var(--signal);font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    header p::before{content:"";width:24px;height:3px;background:var(--signal)}
    section{margin-top:26px}
    h2{margin:0 0 12px;color:var(--muted);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}
    .programs{display:grid;border-top:1px solid var(--line)}
    a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;min-height:96px;padding:18px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
    a:active{background:rgba(199,255,60,.06)}
    strong{display:block;font-size:1.28rem;letter-spacing:-.02em}
    small{display:block;margin-top:5px;color:var(--muted);font-size:.76rem}
    b{display:grid;place-items:center;min-width:54px;height:46px;border:1px solid var(--line);color:var(--signal);font-size:1rem;letter-spacing:.04em}
    footer{margin:28px 2px 0;color:var(--muted);font-size:.72rem;line-height:1.5}
    a:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Treinos</h1>
      <p>Escolha seu programa</p>
    </header>
    <section aria-labelledby="programas">
      <h2 id="programas">Programas disponíveis</h2>
      <div class="programs">
        <a href="treino-intermediario-3x.html"><span><strong>Intermediário</strong><small>3 vezes por semana · W1–W8</small></span><b>3X</b></a>
        <a href="treino-intermediario-4x.html"><span><strong>Intermediário</strong><small>4 vezes por semana · W1–W4</small></span><b>4X</b></a>
        <a href="treino-homem-hard-3x.html"><span><strong>Homem-Hard</strong><small>3 vezes por semana · W1–W8</small></span><b>3X</b></a>
        <a href="treino-homem-hard-4x.html"><span><strong>Homem-Hard</strong><small>4 vezes por semana · W1–W8</small></span><b>4X</b></a>
      </div>
    </section>
    <footer>Funciona offline. Seu progresso e os pesos permanecem somente neste aparelho.</footer>
  </main>
</body>
</html>
